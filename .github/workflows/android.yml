name: Android APK (Cay's English V2)

# Membangun APK dari isi folder v2/ (aplikasi web yang sudah di-build) dan menaruhnya di halaman Releases.
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Salin aplikasi web ke dalam aset APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r v2/. android/app/src/main/assets/www/
          # Di APK semua file sudah lokal, jadi service worker tidak dipakai.
          rm -f android/app/src/main/assets/www/sw.js android/app/src/main/assets/www/workbox-*.js
          ls -R android/app/src/main/assets/www | head -40

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Beri nama file
        run: cp android/app/build/outputs/apk/release/app-release.apk CaysEnglishV2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CaysEnglishV2-apk
          path: CaysEnglishV2.apk

      - name: Terbitkan di Releases (tautan tetap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest CaysEnglishV2.apk \
            --target "$GITHUB_SHA" \
            --title "Cay's English V2 untuk Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unduh CaysEnglishV2.apk di HP Android, buka filenya, lalu ketuk Instal. Aplikasi ini berjalan sepenuhnya offline. Versi baru bisa dipasang langsung di atas versi lama tanpa menghapus progres." \
            --latest
